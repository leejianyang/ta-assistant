name: Generate Summary

on:
  schedule:
    # 北京时间每天早上8点 = UTC 0:00
    - cron: '45 0 * * *'
  workflow_dispatch:  # 允许手动触发

env:
  TZ: Asia/Shanghai
  DATA_BRANCH: data

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0
      
      - name: Sync code from main branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 从 main 分支同步代码文件
          echo "同步 main 分支代码..."
          git fetch origin main
          git checkout origin/main -- '*.py' '*.txt' '*.md' 'requirements.txt' '.github/' '.gitignore' 2>/dev/null || true
          
          echo "当前分支: $(git branch --show-current)"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env file
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env
      
      - name: Run summary generator
        run: python summary.py
        timeout-minutes: 30
      
      - name: Clean up sensitive files
        run: |
          rm -f .env
      
      - name: Commit and push to data branch
        run: |
          git add summary/
          if git diff --staged --quiet; then
            echo "没有新摘要需要提交"
          else
            git commit -m "📝 Daily summary: $(date +'%Y-%m-%d')"
            git push origin $DATA_BRANCH
          fi
